name: Build Campus Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o Campus_Companion_Flutter_Source_Fixed.zip -d .
          test -f Campus_Companion_Mobile/pubspec.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform project
        working-directory: Campus_Companion_Mobile
        run: flutter create --platforms=android .

      - name: Configure Android scheduled notifications
        working-directory: Campus_Companion_Mobile
        run: python3 tools/patch_android_manifest.py

      - name: Install dependencies
        working-directory: Campus_Companion_Mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: Campus_Companion_Mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-companion-android-apk
          path: Campus_Companion_Mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
